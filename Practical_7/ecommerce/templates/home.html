{% extends "base.html" %}

{% block content %}
<h1>Welcome to E-Commerce</h1>
<div class="row">
    {% for product in products %}
    <div class="col-md-4 mb-4">
        <div class="card">
            <img src="{{ product.image_url or url_for('static', filename='no-image.svg') }}" class="card-img-top" alt="{{ product.name }}" onerror="this.onerror=null;this.src='{{ url_for('static', filename='no-image.svg') }}';">
            <div class="card-body">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text">{{ product.description }}</p>
                <p class="card-text"><strong>${{ product.price }}</strong></p>
                <a href="{{ url_for('main.product_detail', product_id=product.id) }}" class="btn btn-primary">View Details</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
