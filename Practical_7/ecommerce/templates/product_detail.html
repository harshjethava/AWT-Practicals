{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <img src="{{ product.image_url or url_for('static', filename='no-image.svg') }}" class="img-fluid" alt="{{ product.name }}" onerror="this.onerror=null;this.src='{{ url_for('static', filename='no-image.svg') }}';">
    </div>
    <div class="col-md-6">
        <h2>{{ product.name }}</h2>
        <p>{{ product.description }}</p>
        <p><strong>Price: ${{ product.price }}</strong></p>
        <form method="POST">
            {{ form.hidden_tag() }}
            <div class="mb-3">
                {{ form.quantity.label(class="form-label") }}
                {{ form.quantity(class="form-control", value=1) }}
            </div>
            <button type="submit" class="btn btn-success">Buy Now</button>
        </form>
    </div>
</div>
{% endblock %}
